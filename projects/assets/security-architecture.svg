<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Hardware-Based Security System conceptual architecture</title>
  <desc id="desc">A simplified block diagram covering physical input, timing and conditioning, discrete logic, validation, lockout and reset, alert and indication, and actuation.</desc>

  <rect x="0" y="0" width="1400" height="820" fill="#f7f3ea"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#12243a">Hardware-Based Security System</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="18" fill="#46576a">Conceptual architecture from my design study. Implementation details are intentionally simplified.</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="175" width="250" height="120" rx="18" fill="#ffffff" stroke="#12243a" stroke-width="3"/>
    <text x="195" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#12243a">Physical Input</text>
    <text x="195" y="249" text-anchor="middle" font-size="16" fill="#46576a">Multi-input authentication</text>
    <text x="195" y="274" text-anchor="middle" font-size="15" fill="#667585">Physical logic interface</text>

    <rect x="385" y="175" width="250" height="120" rx="18" fill="#ffffff" stroke="#12243a" stroke-width="3"/>
    <text x="510" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#12243a">Timing &amp; Conditioning</text>
    <text x="510" y="249" text-anchor="middle" font-size="16" fill="#46576a">Input stabilization</text>
    <text x="510" y="274" text-anchor="middle" font-size="15" fill="#667585">Short / long press behavior</text>

    <rect x="700" y="175" width="250" height="120" rx="18" fill="#ffffff" stroke="#12243a" stroke-width="3"/>
    <text x="825" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#12243a">Discrete Logic</text>
    <text x="825" y="249" text-anchor="middle" font-size="16" fill="#46576a">Transistor-based state handling</text>
    <text x="825" y="274" text-anchor="middle" font-size="15" fill="#667585">Sequencing, gating and reset</text>

    <rect x="1015" y="175" width="250" height="120" rx="18" fill="#ffffff" stroke="#12243a" stroke-width="3"/>
    <text x="1140" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#12243a">Validation</text>
    <text x="1140" y="249" text-anchor="middle" font-size="16" fill="#46576a">Valid / invalid state</text>
    <text x="1140" y="274" text-anchor="middle" font-size="15" fill="#667585">Controlled decision path</text>

    <rect x="225" y="430" width="270" height="130" rx="18" fill="#ffffff" stroke="#12243a" stroke-width="3"/>
    <text x="360" y="472" text-anchor="middle" font-size="22" font-weight="700" fill="#12243a">Lockout &amp; Reset</text>
    <text x="360" y="505" text-anchor="middle" font-size="16" fill="#46576a">Failure handling and recovery</text>
    <text x="360" y="530" text-anchor="middle" font-size="15" fill="#667585">Dedicated state path</text>

    <rect x="565" y="430" width="270" height="130" rx="18" fill="#ffffff" stroke="#12243a" stroke-width="3"/>
    <text x="700" y="472" text-anchor="middle" font-size="22" font-weight="700" fill="#12243a">Alert / Indication</text>
    <text x="700" y="505" text-anchor="middle" font-size="16" fill="#46576a">Alarm and status outputs</text>
    <text x="700" y="530" text-anchor="middle" font-size="15" fill="#667585">Hardware-driven response</text>

    <rect x="905" y="430" width="270" height="130" rx="18" fill="#ffffff" stroke="#12243a" stroke-width="3"/>
    <text x="1040" y="472" text-anchor="middle" font-size="22" font-weight="700" fill="#12243a">Actuation</text>
    <text x="1040" y="505" text-anchor="middle" font-size="16" fill="#46576a">Controlled physical output</text>
    <text x="1040" y="530" text-anchor="middle" font-size="15" fill="#667585">Lock / motor interface</text>

    <rect x="430" y="650" width="540" height="92" rx="18" fill="#12243a"/>
    <text x="700" y="690" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Design Objective</text>
    <text x="700" y="718" text-anchor="middle" font-size="16" fill="#e8edf2">Understand security functions by assigning each function to physical logic.</text>
  </g>

  <g stroke="#6e7e8f" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M320 235 H385"/>
    <path d="M635 235 H700"/>
    <path d="M950 235 H1015"/>
    <path d="M1140 295 V370 H1040 V430"/>
    <path d="M1140 295 V370 H360 V430"/>
    <path d="M635 295 V370 H700 V430"/>
    <path d="M495 495 H565"/>
    <path d="M835 495 H905"/>
  </g>
</svg>
